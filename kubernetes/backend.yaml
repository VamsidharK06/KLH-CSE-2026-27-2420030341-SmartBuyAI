apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartbuy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartbuy-backend
  template:
    metadata:
      labels:
        app: smartbuy-backend
    spec:
      containers:
        - name: backend
          image: e-commerce-web-application-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/shopfront
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartbuy-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartbuy-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartbuy-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smartbuy
spec:
  selector:
    app: smartbuy-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
