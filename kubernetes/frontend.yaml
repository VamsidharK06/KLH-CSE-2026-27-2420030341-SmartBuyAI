apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartbuy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartbuy-frontend
  template:
    metadata:
      labels:
        app: smartbuy-frontend
    spec:
      containers:
        - name: frontend
          image: e-commerce-web-application-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smartbuy
spec:
  selector:
    app: smartbuy-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
